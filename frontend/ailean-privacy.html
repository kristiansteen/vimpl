<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AILEAN - Privatlivspolitik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="assets/css/ailean.css" rel="stylesheet">
</head>

<body>
    <!-- Background -->
    <div class="background-wrapper fixed">
        <img src="assets/images/ailean-burst-vision.jpg" alt="Background" class="hero-bg-image">
        <div class="hero-overlay"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="ailean-philosophy.html" class="logo">AILEAN</a>
        </div>
    </nav>

    <!-- Header -->
    <header class="hero" style="min-height: auto; padding: 160px 0 60px; justify-content: center;">
        <div class="container" style="border: none; text-align: center; padding: 0;">
            <p data-lang="da">REGLER OG VILKÅR</p>
            <p data-lang="en">TERMS AND CONDITIONS</p>
            <h1 data-lang="da">Privatlivspolitik</h1>
            <h1 data-lang="en">Privacy Policy</h1>
        </div>
    </header>

    <!-- Content -->
    <section class="content-section" style="padding: 0 20px 80px; flex: 1; position: relative; z-index: 10;">
        <div class="container"
            style="max-width: 800px; margin: 0 auto; background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px); padding: 3rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
            <style>
                h2 {
                    font-size: 1.5rem;
                    color: var(--white);
                    margin-top: 2rem;
                    margin-bottom: 1rem;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                    padding-bottom: 0.5rem;
                }

                h3 {
                    font-size: 1.2rem;
                    color: var(--primary);
                    margin-top: 1.5rem;
                    margin-bottom: 0.75rem;
                }

                p {
                    color: rgba(255, 255, 255, 0.82);
                    margin-bottom: 1.25rem;
                    font-size: 1rem;
                }

                ul {
                    margin-bottom: 1.5rem;
                    padding-left: 1.5rem;
                    color: rgba(255, 255, 255, 0.82);
                }

                li {
                    margin-bottom: 0.5rem;
                }

                a {
                    color: var(--primary);
                    text-decoration: none;
                    transition: color 0.2s;
                }

                a:hover {
                    color: var(--white);
                    text-decoration: underline;
                }

                @media (max-width: 768px) {
                    nav .container {
                        padding: 0 1.5rem;
                    }

                    .content-container {
                        padding: 2rem;
                    }

                    h1 {
                        font-size: 2.5rem;
                    }
                }

                < !-- Footer --><footer><div class="container"><p>2026 AILEAN.</p></div></footer><script>const htmlElement=document.documentElement;
                const langButtons=document.querySelectorAll('.lang-btn');
                htmlElement.setAttribute('lang', 'da');

                langButtons.forEach(button=> {
                        button.addEventListener('click', ()=> {
                                const lang=button.getAttribute('data-lang-switch');
                                htmlElement.setAttribute('lang', lang);
                                langButtons.forEach(btn=> btn.classList.remove('active'));
                                button.classList.add('active');

                                if (lang==='da') {
                                    document.title='AILEAN - Privatlivspolitik';
                                }

                                else {
                                    document.title='AILEAN - Privacy Policy';
                                }
                            });
                    });
                </script></body></html>
